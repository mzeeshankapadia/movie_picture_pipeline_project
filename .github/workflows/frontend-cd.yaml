name: Frontend CD

on:
  push:
    branches: [ main ]
    paths:
      - "starter/frontend/**"
  workflow_dispatch:

env:
  IMAGE_TAG: ${{ github.sha }}
  EKS_CLUSTER: my-eks-cluster
  AWS_REGION: us-east-1
  REACT_APP_MOVIE_API_URL: http://localhost:5000

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci
      - run: npm test

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{secrets.AWS_SESSION_TOKEN}}
          aws-region: us-east-1

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region us-east-1 \
          | docker login --username AWS --password-stdin ${{secrets.AWS_ACCOUNT_ID}}.dkr.ecr.us-east-1.amazonaws.com

      - name: Build and tag image
        run: |
          docker build --build-arg=REACT_APP_MOVIE_API_URL=${{env.REACT_APP_MOVIE_API_URL}} -t frontend:${IMAGE_TAG} starter/frontend
          docker tag frontend:${IMAGE_TAG} \
            ${{secrets.AWS_ACCOUNT_ID}}.dkr.ecr.us-east-1.amazonaws.com/frontend:${IMAGE_TAG}

      - name: Push image
        run: |
          docker push ${{secrets.AWS_ACCOUNT_ID}}.dkr.ecr.us-east-1.amazonaws.com/frontend:${IMAGE_TAG}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{env.EKS_CLUSTER}} \
            --region ${{env.AWS_REGION}}

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/frontend \
            frontend=${{secrets.AWS_ACCOUNT_ID}}.dkr.ecr.us-east-1.amazonaws.com/frontend:${IMAGE_TAG} \
            --record

          kubectl rollout status deployment/frontend