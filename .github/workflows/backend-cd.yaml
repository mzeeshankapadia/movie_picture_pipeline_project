name: Backend CD

on:
  push:
    branches: [ main ]
    paths:
      - "starter/backend/**"
  workflow_dispatch:

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install pipenv
      - run: pipenv install --dev --deploy
      - run: pipenv run flake8 .

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install pipenv
      - run: pipenv install --dev --deploy
      - run: pipenv run pytest

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region us-east-1 \
          | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com

      - name: Build and push image
        run: |
          docker build -t backend:${IMAGE_TAG} starter/backend
          docker tag backend:${IMAGE_TAG} \
            $AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/backend:${IMAGE_TAG}
          docker push $AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/backend:${IMAGE_TAG}

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/backend \
            backend=$AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/backend:${IMAGE_TAG}
